<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#050a14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SolarMonitor" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    
    <!-- Fix for GitHub Pages sub-directory deployment -->
    <base href="./" />
    <title>SolarMonitor | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        font-family: 'Chakra Petch', sans-serif;
        background-color: #050a14;
        color: #ffffff;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #00bcd4; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00e676; 
      }
      /* Pre-loader styles */
      #root:empty {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #050a14;
      }
      #root:empty::after {
        content: "INITIALIZING SATELLITE LINK...";
        color: #00bcd4;
        font-family: 'Share Tech Mono', monospace;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0% { opacity: 0.3; }
        50% { opacity: 1; }
        100% { opacity: 0.3; }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
